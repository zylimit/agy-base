name: agy-base gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure git core.autocrlf=false before checkout
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: PowerShell AST, Pure-ASCII & No-BOM verification (setup.ps1)
        run: |
          $ErrorActionPreference = 'Stop'
          $full = (Resolve-Path -LiteralPath 'setup.ps1').Path
          $bytes = [System.IO.File]::ReadAllBytes($full)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            Write-Error "UTF-8 BOM detected in setup.ps1"
            exit 1
          }
          foreach ($b in $bytes) {
            if ($b -gt 0x7F) {
              Write-Error "Non-ASCII byte detected in setup.ps1"
              exit 1
            }
          }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            Write-Error "PowerShell parse error in setup.ps1: $($errors[0].Message)"
            exit 1
          }
          Write-Host "PowerShell AST, Pure-ASCII & No-BOM check passed."

      - name: Source doctor & pack-check
        run: |
          node scripts/agy-base.mjs pack-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Independent test suite (run-all.mjs if present)
        run: |
          if (Test-Path -LiteralPath '.agents/tests/run-all.mjs') {
            node .agents/tests/run-all.mjs --level all
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host ".agents/tests/run-all.mjs not yet present; pack-check unit selftests verified."
          }

      - name: Self-contained cross-platform lifecycle smoke (install / idempotent / conflict / uninstall)
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) ("agy-e2e-" + [guid]::NewGuid().ToString('N'))
          $tmpDry = Join-Path ([System.IO.Path]::GetTempPath()) ("agy-dry-" + [guid]::NewGuid().ToString('N'))
          try {
            # 1. Reject Windows reserved device segment before mkdir
            & pwsh -NoProfile -File .\setup.ps1 (Join-Path $tmpDry 'CON')
            if ($LASTEXITCODE -eq 0) { throw "Expected CON path rejection" }

            # 2. Reject bare typo subcommand (exit 2)
            & pwsh -NoProfile -File .\setup.ps1 package
            if ($LASTEXITCODE -ne 2) { throw "Expected exit 2 on bare typo subcommand 'package', got $LASTEXITCODE" }

            # 3. DryRun writes zero files
            & pwsh -NoProfile -File .\setup.ps1 -Target $tmpDry -DryRun -NoAutoCc
            if ($LASTEXITCODE -ne 0) { throw "DryRun failed ($LASTEXITCODE)" }
            if (Test-Path -LiteralPath $tmpDry) { throw "DryRun must not create target directory" }

            # 4. Deferred install (--NoAutoCc) + populate compliant mock .claude/ + SessionStart self-heal
            & pwsh -NoProfile -File .\setup.ps1 -Target $tmp -NoAutoCc
            if ($LASTEXITCODE -ne 0) { throw "Deferred install failed ($LASTEXITCODE)" }

            $contract = Get-Content -LiteralPath 'cc-base-contract.json' -Raw | ConvertFrom-Json
            New-Item -ItemType Directory -Path (Join-Path $tmp '.claude/rules') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $tmp '.claude/agents') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $tmp '.claude/hooks') -Force | Out-Null
            [System.IO.File]::WriteAllText((Join-Path $tmp '.claude/CLAUDE.md'), "# Mock CLAUDE`n")
            for ($i = 1; $i -le 15; $i++) {
              $sd = Join-Path $tmp (".claude/skills/skill-{0:D2}" -f $i)
              New-Item -ItemType Directory -Path $sd -Force | Out-Null
              [System.IO.File]::WriteAllText((Join-Path $sd 'SKILL.md'), "# Skill $i`n")
            }
            foreach ($r in $contract.agents.requiredRoles) {
              [System.IO.File]::WriteAllText((Join-Path $tmp ".claude/agents/$r.md"), "---`nname: $r`ndescription: Role $r`n---`nBody`n")
            }
            foreach ($h in $contract.hooks.requiredScripts) {
              [System.IO.File]::WriteAllText((Join-Path $tmp ".claude/hooks/$h"), "// mock`n")
            }

            # Trigger SessionStart self-healing
            '{}' | node (Join-Path $tmp '.agents/scripts/hook-adapter.mjs') SessionStart | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "SessionStart self-heal failed" }

            # Verify zero root files & doctor pass
            node (Join-Path $tmp '.agents/scripts/doctor.mjs') $tmp --json
            if ($LASTEXITCODE -ne 0) { throw "Downstream doctor failed ($LASTEXITCODE)" }

            # 5. Idempotent reinstall + uninstall leaves .claude/ 100% intact
            & pwsh -NoProfile -File .\setup.ps1 -Target $tmp
            if ($LASTEXITCODE -ne 0) { throw "Reinstall failed ($LASTEXITCODE)" }
            & pwsh -NoProfile -File .\setup.ps1 -Uninstall -Target $tmp -Force
            if ($LASTEXITCODE -ne 0) { throw "Uninstall failed ($LASTEXITCODE)" }
            if (-not (Test-Path -LiteralPath (Join-Path $tmp '.claude/skills/skill-01/SKILL.md'))) {
              throw "CRITICAL: .claude/skills content was touched by uninstall!"
            }
          } finally {
            if (Test-Path -LiteralPath $tmp) { Remove-Item -LiteralPath $tmp -Recurse -Force }
            if (Test-Path -LiteralPath $tmpDry) { Remove-Item -LiteralPath $tmpDry -Recurse -Force }
          }
